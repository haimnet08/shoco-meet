# Shoco Meet TURN server (coturn) for meet.shocoweb.com. Credentials: TURN REST API, secret in /etc/shoco-meet/env.
listening-ip=157.173.122.245
relay-ip=157.173.122.245
external-ip=157.173.122.245
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49400
realm=meet.shocoweb.com
server-name=meet.shocoweb.com
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=__TURN_SECRET__
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
stale-nonce=600
total-quota=100
user-quota=12
max-bps=3000000
# relay only to public addresses
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
syslog
