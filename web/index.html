<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shoco Meet</title>
<link rel="stylesheet" href="style.css">
<script src="peerjs.min.js"></script>
</head>
<body>
<section id="lobby">
  <h1>Shoco Meet 🎥</h1>
  <p>פגישות וידאו בדפדפן – בלי התקנה / Video meetings in the browser</p>
  <input id="name" placeholder="השם שלך / Your name" maxlength="30">
  <input id="room" placeholder="קוד חדר (ריק = חדר חדש)" maxlength="40">
  <button id="joinBtn" class="primary">הצטרף / צור חדר</button>
  <p id="lobbyMsg"></p>
</section>
<section id="meeting" hidden>
  <header>
    <span id="roomLabel"></span>
    <button id="copyBtn">📋 העתק קישור</button>
    <a id="waBtn" target="_blank" rel="noopener" class="wa">שתף בוואטסאפ</a>
    <span id="status"></span>
  </header>
  <main>
    <div id="videos"></div>
    <aside id="chat">
      <div id="msgs"></div>
      <form id="chatForm"><input id="chatInput" placeholder="הודעה..." autocomplete="off"><button>שלח</button></form>
    </aside>
  </main>
  <footer>
    <button id="micBtn">🎤 השתק</button>
    <button id="camBtn">📷 כבה מצלמה</button>
    <button id="shareBtn">🖥️ שיתוף מסך</button>
    <button id="recBtn">⏺️ הקלטה</button>
    <button id="chatToggle">💬 צ'אט</button>
    <button id="leaveBtn" class="danger">יציאה</button>
  </footer>
</section>
<script src="app.js"></script>
</body>
</html>
